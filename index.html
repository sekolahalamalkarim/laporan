<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Sekolah Alam Al-Karim</title>
  <style>
    :root {
      --primary: #2E7D32; --primary-dark: #1B5E20; --primary-light: #4CAF50;
      --secondary: #E8F5E9; --accent: #81C784;
      --gray-100: #f5f5f5; --gray-300: #e0e0e0; --gray-500: #9e9e9e; --gray-700: #616161;
      --danger: #c62828;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh;
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 60%, #388E3C 100%);
      display: flex; align-items: center; justify-content: center; padding: 20px; }

    .card { background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 420px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.3); }

    .logo { text-align: center; margin-bottom: 32px; }
    .logo-icon { width: 72px; height: 72px; background: var(--secondary); border-radius: 20px;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 36px; }
    .logo h1 { font-size: 22px; font-weight: 800; color: var(--primary-dark); }
    .logo p  { font-size: 13px; color: var(--gray-500); margin-top: 4px; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: var(--gray-700);
      margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
    .form-group input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--gray-300);
      border-radius: 10px; font-size: 14px; outline: none; font-family: inherit;
      transition: border-color .2s, box-shadow .2s; }
    .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(46,125,50,.12); }

    .btn-login { width: 100%; padding: 14px; background: var(--primary); color: white; border: none;
      border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background .2s;
      margin-top: 6px; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-login:hover { background: var(--primary-dark); }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; }

    .error-msg { background: #FFEBEE; border-left: 4px solid var(--danger); color: var(--danger);
      padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: 13px; font-weight: 600;
      margin-bottom: 16px; display: none; }
    .error-msg.show { display: block; }

    .info-box { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--gray-300); }
    .info-box p { font-size: 12px; color: var(--gray-500); text-align: center; margin-bottom: 10px; }
    .role-pills { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
    .role-pill { background: var(--secondary); border: 1px solid var(--accent); border-radius: 20px;
      padding: 4px 14px; font-size: 11px; font-weight: 700; color: var(--primary-dark); }

    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.4);
      border-top-color: white; border-radius: 50%; animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🏫</div>
    <h1>Sekolah Alam Al-Karim</h1>
    <p>Sistem Informasi Terpadu</p>
  </div>

  <div class="error-msg" id="error-msg"></div>

  <div class="form-group">
    <label>Username</label>
    <input type="text" id="username" placeholder="Masukkan username" autocomplete="username"
      onkeydown="if(event.key==='Enter')doLogin()" />
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')doLogin()" />
  </div>

  <button class="btn-login" id="btn-login" onclick="doLogin()">
    Masuk →
  </button>

  <div style="margin:16px 0;text-align:center">
    <div style="font-size:11px;color:var(--gray-500);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em;font-weight:700">— atau —</div>
    <a href="portal-ortu-pin.html" style="display:inline-flex;align-items:center;gap:8px;background:var(--secondary);border:1.5px solid var(--accent);border-radius:10px;padding:11px 20px;text-decoration:none;color:var(--primary-dark);font-weight:700;font-size:14px;transition:all .2s">
      👨‍👩‍👧 Masuk sebagai Orangtua (via PIN)
    </a>
  </div>

  <div class="info-box">
    <p>Login dengan akun untuk:</p>
    <div class="role-pills">
      <span class="role-pill">🧑‍🏫 Guru / Karyawan</span>
      <span class="role-pill">👔 Pimpinan</span>
    </div>
  </div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbwaUZAm8zoxvCfKo8xgOU7goa3GZYXH-IkcVZ2Yb1Xw6wvbIXPEB-b8wL_p6HVU5Qav/exec';

  // Jika sudah login, redirect langsung
  const saved = sessionStorage.getItem('currentUser');
  if (saved) {
    const u = JSON.parse(saved);
    redirectUser(u.role);
  }

  function redirectUser(role) {
    if (role === 'guru')     window.location.href = 'portal-guru.html';
    else if (role === 'ortu')     window.location.href = 'portal-ortu.html';
    else if (role === 'pimpinan') window.location.href = 'portal-pimpinan.html';
  }

  function setLoading(on) {
    const btn = document.getElementById('btn-login');
    btn.disabled = on;
    btn.innerHTML = on
      ? '<div class="spinner"></div> Memverifikasi...'
      : 'Masuk →';
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = '⚠️ ' + msg;
    el.classList.add('show');
  }

  function hideError() {
    document.getElementById('error-msg').classList.remove('show');
  }

  function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    hideError();

    if (!username || !password) { showError('Username dan password wajib diisi'); return; }

    setLoading(true);

    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'login', username, password }),
    })
    .then(r => r.json())
    .then(res => {
      setLoading(false);
      if (!res.ok) { showError(res.error || 'Login gagal'); return; }
      sessionStorage.setItem('currentUser', JSON.stringify(res.user));
      redirectUser(res.user.role);
    })
    .catch(err => {
      setLoading(false);
      showError('Tidak dapat terhubung ke server. Coba lagi.');
    });
  }
</script>
</body>
</html>
